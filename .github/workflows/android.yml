name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Keystore (if secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/mboxpro.jks
          else
            echo "KEYSTORE_BASE64 secret নেই — debug key দিয়ে সাইন হবে"
          fi

      - name: Get App Version
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName\s*=?\s*["'\'']\K[^"'\'']+' app/build.gradle* | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Rename APKs
        run: |
          V=${{ steps.get_version.outputs.version }}
          D=app/build/outputs/apk/release
          mv $D/app-armeabi-v7a-release.apk $D/MBoxPro-v$V-AndroidTV-32bit-armeabi-v7a.apk
          mv $D/app-arm64-v8a-release.apk   $D/MBoxPro-v$V-64bit-arm64-v8a.apk
          mv $D/app-universal-release.apk   $D/MBoxPro-v$V-universal.apk
          ls -la $D

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          name: MBox Pro Release v${{ steps.get_version.outputs.version }} (Build ${{ github.run_number }})
          files: app/build/outputs/apk/release/MBoxPro-v*.apk
