name: Generate Keystore
on: workflow_dispatch
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore & Base64
        run: |
          keytool -genkey -v -keystore mboxpro.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mboxpro -storepass mboxpro123 -keypass mboxpro123 -dname "CN=MBox Pro, OU=App, O=MBox Pro, L=Dhaka, S=Dhaka, C=BD"
          echo "=== নিচের পুরো লেখাটি কপি করুন ==="
          base64 -w 0 mboxpro.jks
          echo ""
